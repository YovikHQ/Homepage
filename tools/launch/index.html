<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YOVIK | Launch Calculator</title>

<link rel="stylesheet" href="launch.css">

</head>

<body>

<div class="mouse-glow"></div>

<header class="hero">

<div class="hero-content">

<div class="badge">
FREE YOVIK TOOL
</div>

<h1>Launch Calculator™</h1>

<p class="subtitle">
Can Your Dream Pay You?
</p>

<p class="description">

Estimate startup costs,
project your profits,
and discover how quickly your business
could recover its investment.

</p>

<a href="#workspace" class="hero-button">

Start Planning

</a>

</div>

</header>

<main id="workspace">

<div class="workspace">

<!-- LEFT COLUMN -->

<div class="planner">

<div class="card">

<h2>Business Type</h2>

<p>Select the business you're planning.</p>

<div class="business-grid">

<button class="business-card active">
🌭
<span>Hot Dog Cart</span>
</button>

<button class="business-card">
🌮
<span>Taco Trailer</span>
</button>

<button class="business-card">
☕
<span>Coffee Cart</span>
</button>

<button class="business-card">
🍋
<span>Lemonade</span>
</button>

<button class="business-card">
🍧
<span>Shaved Ice</span>
</button>

<button class="business-card">
➕
<span>Other</span>
</button>

</div>

</div>

<div class="card">

<h2>Startup Costs</h2>

<div class="input-group">

<label>Equipment</label>

<input id="equipment" type="number" placeholder="$0">

</div>

<div class="input-group">

<label>Licensing</label>

<input id="license" type="number" placeholder="$0">

</div>

<div class="input-group">

<label>Initial Inventory</label>

<input id="inventory" type="number" placeholder="$0">

</div>

<div class="input-group">

<label>Miscellaneous</label>

<input id="misc" type="number" placeholder="$0">

</div>

</div>
