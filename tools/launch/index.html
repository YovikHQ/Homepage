<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOVIK | Launch Calculator</title>

    <link rel="stylesheet" href="launch.css">
</head>

<body>

<div class="mouse-glow"></div>

<header class="hero">

    <div class="hero-content">

        <div class="badge">
            FREE YOVIK TOOL
        </div>

        <h1>Launch Calculator™</h1>

        <p class="subtitle">
            Can Your Dream Pay You?
        </p>

        <p class="description">
            Estimate startup costs, projected profits,
            and how quickly your business could recover
            its investment.
        </p>

        <a href="#calculator" class="hero-button">
            Start Planning
        </a>

    </div>

</header>

<main id="calculator">

<section class="calculator">

<div class="section-title">

<h2>Choose Your Business</h2>

<p>Select the business you'd like to launch.</p>

</div>

<div class="business-grid">

<button class="business-card active">
<div class="emoji">🌭</div>
<span>Hot Dog Cart</span>
</button>

<button class="business-card">
<div class="emoji">🌮</div>
<span>Taco Trailer</span>
</button>

<button class="business-card">
<div class="emoji">☕</div>
<span>Coffee Cart</span>
</button>

<button class="business-card">
<div class="emoji">🍋</div>
<span>Lemonade</span>
</button>

<button class="business-card">
<div class="emoji">🍧</div>
<span>Shaved Ice</span>
</button>

<button class="business-card">
<div class="emoji">➕</div>
<span>Other</span>
</button>

</div>

</section>

<section class="calculator">

<div class="section-title">

<h2>Startup Costs</h2>

<p>Estimate your initial investment.</p>

</div>

<div class="input-grid">

<div class="input-group">

<label>Equipment</label>

<input id="equipment" type="number" placeholder="0">

</div>

<div class="input-group">

<label>Licensing</label>

<input id="license" type="number" placeholder="0">

</div>

<div class="input-group">

<label>Initial Inventory</label>

<input id="inventory" type="number" placeholder="0">

</div>

<div class="input-group">

<label>Miscellaneous</label>

<input id="misc" type="number" placeholder="0">

</div>

</div>

</section>
